server:
  port: 8080

spring:
  application:
    name: shiretechnik


  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


logging:
  level:
    org.springframework.mail: INFO
    org.hibernate.SQL: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration:  ${JWT_EXPIRY}

shiretechnik:
  mail:
    contact-recipient: ailhreshikesh@gmail.com

google:
  calendar:
    id: primary
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT}

gemini:
  api:
    key: ${GEMINI_SECRET}
